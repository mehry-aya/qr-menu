<div class="container">
    <form [formGroup] = "menuForm">
    <div class="row">
        <div class="col-md-5">
            <div class="form-group">
                <label for="category">Category</label>
                <input formControlName="category" type="text" class="form-control" id="category"  placeholder="category">
            </div>
        </div>
        <div class="col-md-2"></div>
        <div class="col-md-5">
            <div class="form-group">
                <label for="logo">logo</label>
                <input formControlName="logo" type="text" class="form-control" id="logo" placeholder="Logo">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-5">
            <div class="form-group">
                <label for="image">Image</label>
                <input formControlName="image" type="text" class="form-control" id="image"  placeholder="image">
            </div>
        </div>
        <div class="col-md-2"></div>
        <div class="col-md-5">
            <button type="button" (click)="add()" class="btn btn-outline-success" [disabled]="menuForm.invalid">Ajouter</button>
        </div>
    </div>
    </form>
</div>

<div class="container">
    <div class="row">
        <div *ngFor="let menu of menuList" class="col-md-3">
            <div class="card" >
                <img
                    class="card-img-top"
                    src="https://png.pngtree.com/png-clipart/20200224/original/pngtree-businessman-avatar-cartoon-style-png-image_5234654.jpg">
                <div class="card-body">
                    <h5 class="card-title">{{menu.category}}</h5>
                    <button type="button" class="btn btn-danger btn-sm" (click)="delete(menu.id)">
                    <span class="d-none d-md-inline">Delete</span>
                    </button>
                    <button type="submit"
                            [routerLink]="[menu.id, 'edit']"
                            queryParamsHandling="merge"
                            class="btn btn-primary btn-sm">
                        <span class="d-none d-md-inline">Edit</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
