<div class="modal-header">
    <h4 class="modal-title">S'authentifier</h4>

    <button aria-label="Close" data-dismiss="modal" class="close" type="button" (click)="activeModal.dismiss('closed')">
        <span aria-hidden="true">x</span>
    </button>
</div>

<div class="modal-body">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div>
                <a class="alert-link" (click)="register()">créer un compte</a>
            </div>
            <div class="alert alert-danger" *ngIf="authenticationError">
                <strong>Authentification Echoué</strong> Vérifier vos coordonnés !
            </div>
        </div>

        <div class="col-md-8">
            <form class="form" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
                <div class="form-group">
                    <label class="username-label" for="username">Nom d'utilisateur</label>
                    <input type="text" class="form-control" name="username" id="username" placeholder="votre nom d'utilisateur"
                           formControlName="username" #username>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="votre mot de passe"
                           formControlName="password">
                </div>

                <div class="form-check">
                    <label class="form-check-label" for="rememberMe">
                        <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a class="alert-link" (click)="requestResetPassword()">mot de passe oublié?</a>
                </div>
            </form>
        </div>
    </div>
    <button (click)="login()" type="submit" class="btn btn-primary">S'authentifier</button>
</div>
