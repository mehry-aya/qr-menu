<div class="container-fluid">
<div class="col-md-12">
    <ngb-accordion #acc="ngbAccordion">
        <ngb-panel id="toggle-1" title="Nouveau Etablissement">
            <ng-template ngbPanelContent>
                <form [formGroup]="estabForm">
                    <div class="row">
                        <div class="form-group">
                            <label>Logo</label>
                            <div class="input-group mb-3">
                                <div class="custom-file">
                                    <input (change)="onUploadFile($event.target)"
                                           formControlName="logo"
                                           id="file"
                                           name="files"
                                           type="file"
                                           accept="image/*">

                                    <label class="custom-file-label"
                                           for="file">{{logo?.name}}

                                    </label>
                                </div>
                                <div class="input-group-append">
                                    <button class="input-group-text" (click)="deleteFile(logo.id)" [disabled]="!logo">
                                        <fa-icon icon="trash" [fixedWidth]="true" [size]="'1x'"></fa-icon>
                                    </button>
                                </div>
                        </div>
                        </div>
                        <div class="col-1"></div>

                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="name">Nom</label>
                                <input class="form-control" formControlName="name" id="name" placeholder="nom"
                                       type="text">

                                <label for="category">Categorie</label>
                                <input class="form-control" formControlName="category" id="category"
                                       placeholder="categorie"
                                       type="text">

                                <label for="adress">Adresse</label>
                                <input class="form-control" formControlName="adress" id="adress" placeholder="adresse"
                                       type="text">

                                <label for="contact">Contact</label>
                                <input class="form-control" formControlName="contact" id="contact" placeholder="contact"
                                       type="text">

                                <div>
                                    <button (click)="add()" [disabled]="estabForm.invalid" class="btn btn-outline-success float-lg-right"
                                            type="submit">Ajouter
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-2"></div>
                    </div>
                </form>
            </ng-template>
        </ngb-panel>
    </ngb-accordion>
</div>


<div class="container row">
    <div *ngFor="let establishment of estabList" class="col-md-5">
        <div class="card">

            <img *ngIf="establishment.logo"
                 [src]="getImageUrl(establishment.logo)">

            <div class="card-body">
                <h6>{{establishment.category}} <br> {{establishment.name}}</h6>
                <hr>
                <p>{{establishment.contact}}</p>
                <hr>
                <p>{{establishment.adress}}</p>
                <hr>
            </div>
            <div class="card-body">
                <div >
                    <button class="btn btn-lg btn-primary" routerLink="/menu-management/{{establishment.id}}" type="button">Menu</button>
                </div>
<br>
                <div class="float-lg-right">
                    <button [routerLink]="[establishment.id, 'edit']"
                            class="btn btn-outline-info"
                            type="submit">
                        <fa-icon icon="edit" [fixedWidth]="true" [size]="'1x'"></fa-icon>
                    </button>
                    <button class="btn btn-light" (click)="delete(establishment.id)" type="button">
                        <fa-icon icon="trash" [fixedWidth]="true" [size]="'1x'"></fa-icon>
                    </button>
                </div>


            </div>

        </div>
    </div>
</div>
</div>
